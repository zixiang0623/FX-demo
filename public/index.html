<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX-demo — AIが操作できるFX疑似体験</title>
<style>
:root{--bg:oklch(.975 .004 250);--card:#fff;--ink:oklch(.22 .02 255);--mute:oklch(.55 .02 255);--line:oklch(.92 .006 255);--up:oklch(.56 .15 150);--dn:oklch(.58 .19 25);--ac:oklch(.5 .17 262);--ai:oklch(.52 .2 300);--r:14px}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);padding:16px;max-width:1280px;margin:auto;font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;vertical-align:-3px;flex:none}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:20px;letter-spacing:-.02em}h1 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px;letter-spacing:0}
.sp{flex:1}.dot{width:8px;height:8px;border-radius:50%;background:var(--dn);display:inline-block}.dot.ok{background:var(--up)}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:14px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.col-c{grid-column:1/-1;order:-1}}
@media(max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}body{padding:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:12px;color:var(--mute);font-weight:600;margin-bottom:10px;display:flex;gap:6px;align-items:center;letter-spacing:.02em}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;transition:transform .15s,background .15s,box-shadow .15s;display:inline-flex;gap:6px;align-items:center;justify-content:center}
button:hover{background:var(--bg)}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.q{width:100%;justify-content:space-between;margin-bottom:6px;padding:10px 12px;text-align:left}.q.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.q b{display:block;font-size:13px}.q span{font-size:12px;color:var(--mute)}.up{color:var(--up)}.dn{color:var(--dn)}
.big{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15}.big small{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px}
canvas{width:100%;height:260px;display:block;margin-top:10px}
.ord{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
label{font-size:12px;color:var(--mute);display:block}input{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:3px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bs button{padding:12px;font-weight:700;color:#fff;border:0}
.sell{background:var(--dn)}.sell:hover{background:oklch(.52 .19 25)}.buy{background:var(--up)}.buy:hover{background:oklch(.5 .15 150)}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.url{display:flex;gap:6px}.url input{font:12px ui-monospace,monospace;margin:0;min-width:0}
.tag{font-size:11px;line-height:1.6;vertical-align:middle;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--mute);display:inline-flex;gap:4px;align-items:center}.tag.AI{background:oklch(.95 .04 300);color:var(--ai);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mute);font-weight:500;text-align:right;padding:6px;border-bottom:1px solid var(--line);font-size:12px}td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}.li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:baseline}.li>div{min-width:0;overflow-wrap:anywhere}.tag .ic{width:14px;height:14px;vertical-align:0}.li time{color:var(--mute);font-size:12px;flex:none}
.empty{color:var(--mute);padding:10px 0;font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>FX-demo<small>AIが操作できる、FX疑似体験</small></h1><div class="sp"></div>
  <span class="tag"><i class="dot" id="st"></i> 1,000,000円のデモ資金</span>
  <button id="rst"><span data-i="rotate-ccw"></span>リセット</button>
</header>
<div class="grid">
  <div class="stack"><div class="card"><h2>通貨ペア</h2><div id="ql"></div></div>
    <div class="card"><h2><span data-i="newspaper"></span>ニュース</h2><div id="nw"></div></div></div>
  <div class="stack col-c">
    <div class="card"><div class="big" id="px">—<small id="sub"></small></div><canvas id="cv"></canvas>
      <div class="ord">
        <label>数量(通貨)<input id="u" type="number" value="10000" min="1000" step="1000"></label>
        <label>損切り(pips)<input id="sl" type="number" placeholder="なし" min="0"></label>
        <label>利確(pips)<input id="tp" type="number" placeholder="なし" min="0"></label>
      </div>
      <div class="bs"><button class="sell" id="sell"><span data-i="trending-down"></span>売る</button><button class="buy" id="buy"><span data-i="trending-up"></span>買う</button></div>
      <p class="hint" id="mh"></p>
      <p class="hint">売る=下がると得、買う=上がると得。1pip=為替の最小単位(円ペアは0.01円)。レバレッジは25倍で、証拠金が足りなくなるとロスカットされます。</p></div>
    <div class="card"><h2>ポジション</h2><div class="sc" id="pos"></div></div>
  </div>
  <div class="stack">
    <div class="card"><h2>口座</h2><div id="ac"></div></div>
    <div class="card"><h2><span data-i="plug"></span>AIをつなぐ(MCP)</h2>
      <div class="url"><input id="mcp" readonly><button id="cp" aria-label="コピー"><span data-i="copy"></span></button></div>
      <p class="hint">Claudeなどの「カスタムコネクタ」にこのURLを追加すると、AIが相場確認・発注・決済を実行します。AIの操作は下の履歴に <span class="tag AI"><span data-i="bot"></span>AI</span> で表示されます。</p></div>
    <div class="card"><h2>操作履歴</h2><div id="lg"></div></div>
  </div>
</div>
<div id="toast"></div>
<script>
const P={bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',"rotate-ccw":'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',newspaper:'<path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/>',plug:'<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',"trending-up":'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',"trending-down":'<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const $=s=>document.querySelector(s),yen=n=>Math.round(n).toLocaleString("ja-JP")+"円",sg=n=>(n>=0?"+":"")+Math.round(n).toLocaleString("ja-JP"),tm=t=>new Date(t).toLocaleTimeString("ja-JP");
const icons=r=>r.querySelectorAll("[data-i]").forEach(e=>e.outerHTML=ic(e.dataset.i));
let pair="USDJPY",S=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),3000)}
async function load(){try{S=await(await fetch("/api/state?pair="+pair)).json();$("#st").className="dot ok";render()}catch{$("#st").className="dot"}}
async function tool(n,a){const r=await(await fetch("/api/tool/"+n,{method:"POST",body:JSON.stringify(a||{})})).json();if(r.error)toast(r.error);load()}
function tag(by){return by==="AI"?`<span class="tag AI">${ic("bot")}AI</span>`:`<span class="tag">${by==="SYS"?"システム":"あなた"}</span>`}
function render(){
  const q=S.quotes.find(x=>x.pair===pair),d=q.pair.endsWith("JPY")?3:5;
  $("#ql").innerHTML=S.quotes.map(x=>`<button class="q ${x.pair===pair?"on":""}" data-p="${x.pair}"><div><b>${x.pair.slice(0,3)}/${x.pair.slice(3)}</b><span>${x.bid.toFixed(x.pair.endsWith("JPY")?3:5)}</span></div><span class="${x.change_pct>=0?"up":"dn"}">${x.change_pct>=0?"+":""}${x.change_pct.toFixed(2)}%</span></button>`).join("");
  $("#px").innerHTML=`${q.bid.toFixed(d)}<small>売値 / 買値 ${q.ask.toFixed(d)} ・ スプレッド ${q.spread_pips}pips</small>`;
  const u=+$("#u").value||0;$("#mh").textContent=u>=1000?`必要証拠金の目安: 約${yen(u*q.base_jpy/25)}`:"数量は1,000通貨以上";
  const a=S.account,rows=[["残高",yen(a.balance)],["有効証拠金",yen(a.equity)],["含み損益",`<span class="${a.unrealized_pnl>=0?"up":"dn"}">${sg(a.unrealized_pnl)}円</span>`],["使用証拠金",yen(a.margin)],["余剰証拠金",yen(a.free_margin)],["証拠金維持率",a.margin_level_pct==null?"—":a.margin_level_pct+"%"]];
  $("#ac").innerHTML=rows.map(r=>`<div class="kv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("");
  $("#pos").innerHTML=S.positions.length?`<table><tr><th>ペア</th><th>売買</th><th>数量</th><th>約定</th><th>現在</th><th>SL/TP</th><th>損益</th><th></th></tr>${S.positions.map(x=>`<tr><td>#${x.id} ${x.pair} ${tag(x.by)}</td><td class="${x.side==="buy"?"up":"dn"}">${x.side==="buy"?"買":"売"}</td><td>${x.units.toLocaleString()}</td><td>${x.open}</td><td>${x.current}</td><td>${x.sl??"—"} / ${x.tp??"—"}</td><td class="${x.pnl_jpy>=0?"up":"dn"}">${sg(x.pnl_jpy)}</td><td><button data-c="${x.id}" aria-label="決済">${ic("x")}</button></td></tr>`).join("")}</table>`:`<p class="empty">ポジションはありません。注文するか、AIに頼んでみましょう。</p>`;
  $("#lg").innerHTML=S.log.length?S.log.slice(0,12).map(l=>`<div class="li"><time>${tm(l.t)}</time><div>${tag(l.by)} ${l.msg}</div></div>`).join(""):`<p class="empty">まだ操作がありません</p>`;
  $("#nw").innerHTML=S.news.length?S.news.slice(0,4).map(n=>`<div class="li"><div><span class="${n.dir==="up"?"up":"dn"}">${n.pair}</span> ${n.h}</div></div>`).join(""):`<p class="empty">大きなニュースが出ると、ここに表示されます</p>`;
  draw();
}
function draw(){
  const c=$("#cv"),r=c.getBoundingClientRect(),k=devicePixelRatio||1,h=S.hist;c.width=r.width*k;c.height=r.height*k;
  const g=c.getContext("2d"),W=r.width,H=r.height,cs=getComputedStyle(document.body);g.scale(k,k);
  let lo=Math.min(...h),hi=Math.max(...h);const pd=(hi-lo)*.12||1e-4;lo-=pd;hi+=pd;
  const X=i=>i/(h.length-1)*W,Y=v=>H-(v-lo)/(hi-lo)*H,up=h[h.length-1]>=h[0],col=cs.getPropertyValue(up?"--up":"--dn");
  g.strokeStyle=cs.getPropertyValue("--line");g.lineWidth=1;for(let i=1;i<5;i++){g.beginPath();g.moveTo(0,H*i/5);g.lineTo(W,H*i/5);g.stroke()}
  g.beginPath();h.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.strokeStyle=col;g.lineWidth=2;g.lineJoin="round";g.stroke();
  g.lineTo(W,H);g.lineTo(0,H);g.closePath();const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,col.replace(")"," / .18)"));gr.addColorStop(1,col.replace(")"," / 0)"));g.fillStyle=gr;g.fill();
  g.setLineDash([5,4]);g.font="11px system-ui";S.positions.filter(x=>x.pair===pair).forEach(x=>{if(x.open<lo||x.open>hi)return;g.strokeStyle=cs.getPropertyValue("--ac");g.beginPath();g.moveTo(0,Y(x.open));g.lineTo(W,Y(x.open));g.stroke();g.fillStyle=cs.getPropertyValue("--ac");g.fillText(`#${x.id} ${x.side==="buy"?"買":"売"} ${x.open}`,0,Y(x.open)-4)});
  g.setLineDash([]);g.fillStyle=cs.getPropertyValue("--mute");g.fillText(hi.toFixed(pair.endsWith("JPY")?3:5),0,12);g.fillText(lo.toFixed(pair.endsWith("JPY")?3:5),0,H-5);
}
const order=side=>tool("place_order",{pair,side,units:+$("#u").value,sl_pips:+$("#sl").value||undefined,tp_pips:+$("#tp").value||undefined});
$("#buy").onclick=()=>order("buy");$("#sell").onclick=()=>order("sell");$("#u").oninput=()=>S&&render();
$("#rst").onclick=()=>confirm("デモ口座を最初の状態に戻しますか?")&&tool("reset_account");
document.addEventListener("click",e=>{const p=e.target.closest("[data-p]"),c=e.target.closest("[data-c]");if(p){pair=p.dataset.p;load()}if(c)tool("close_position",{id:+c.dataset.c})});
$("#mcp").value=location.origin+"/mcp";$("#cp").onclick=()=>navigator.clipboard.writeText($("#mcp").value).then(()=>toast("MCPのURLをコピーしました"));
addEventListener("resize",()=>S&&draw());icons(document);load();setInterval(load,1500);
</script>
</body>
</html>
